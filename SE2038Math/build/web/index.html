<html>
    <head>
        <title>SE2038 Math</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <center><div><h2>CALCULATOR OF SE2038</h2></div></center>
        <form action="mymath" method="POST">
            <table>
                <tr>
                    <td>Number 1</td>
                    <td><input type="text" name="num1"></td>
                </tr>
                <tr>
                    <td>Number 2</td>
                    <td><input type="text" name="num2"></td>
                </tr>
                <tr>
                    <td>Operators</td>
                    <td>
                        <input type="radio" name="op" value="+" checked>Summation<br>
                        <input type="radio" name="op" value="-">Substract<br>
                        <input type="radio" name="op" value="*">Product<br>
                        <input type="radio" name="op" value="/">Quotien
                    </td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Calcualte">
                        <input type="reset" value="Clear">
                    </td>
                </tr>
            </table>
        </form>

</body>
</html>
